<!DOCTYPE html>
<html lang="it">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>

<style>
  /* Stili specifici di questo modulo */
  .tab-seq { display: flex; flex-wrap: wrap; gap: 4px 3px; align-items: flex-start; }
  .tab-seq .cl { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .tab-seq .cl.sp { width: .7em; }
  .tab-seq .c { width: 2.1em; text-align: center; font-family: var(--f-mono); font-weight: 600; font-size: var(--fs-sm); padding: .2em 0; border-radius: 5px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  .tab-seq .c.k { color: var(--info-t); border-color: var(--info); background: color-mix(in srgb, var(--info) 12%, var(--bg)); }
  .tab-seq .c.o { color: var(--accent-alt); border-color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, var(--bg)); }
  .tab-seq .c.nv { visibility: hidden; }
  .tab-seq .c.cur { outline: 3px solid var(--info-t); outline-offset: 0; }
  .leg { display: flex; flex-wrap: wrap; gap: .3rem .9rem; font-size: var(--fs-xs); color: var(--text-muted); }
  .leg i { display: inline-block; width: .9em; height: .9em; border-radius: 3px; vertical-align: -1px; margin-right: .35em; border: 1px solid var(--border); }
  .leg i.k { background: color-mix(in srgb, var(--info) 30%, var(--bg)); border-color: var(--info); }
  .leg i.o { background: color-mix(in srgb, var(--accent) 30%, var(--bg)); border-color: var(--accent); }
  .chiave-box { display: inline-flex; gap: .35rem; align-items: center; flex-wrap: wrap; }
  .chiave-box b { font-family: var(--f-mono); min-width: 2em; text-align: center; padding: .2em .5em; border-radius: 8px; border: 2px solid var(--info); color: var(--info-t); background: color-mix(in srgb, var(--info) 12%, var(--bg)); }
  .freq { display: flex; align-items: flex-end; gap: 3px; height: 5.2rem; }
  .freq .b { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; }
  .freq .b i { display: block; width: 100%; background: var(--info); border-radius: 3px 3px 0 0; min-height: 1px; }
  .freq.cif .b i { background: var(--accent); }
  .freq-let { display: flex; gap: 3px; }
  .freq-let span { flex: 1 1 0; text-align: center; font-family: var(--f-mono); font-size: 11px; color: var(--text-muted); }
  .griglia-col { display: grid; gap: 3px; font-family: var(--f-mono); font-size: var(--fs-sm); }
  .griglia-col .h { text-align: center; color: var(--text-muted); font-size: var(--fs-xs); }
  .griglia-col .g { text-align: center; padding: .15em 0; border-radius: 5px; border: 1px solid var(--border); background: var(--bg); }
  .griglia-col .g.p0 { border-color: var(--info); color: var(--info-t); }
  .griglia-col .g.p1 { border-color: var(--accent); color: var(--accent-alt); }
  .griglia-col .g.p2 { border-color: var(--success); color: var(--success-t); }
  .match { font-family: var(--f-mono); font-size: var(--fs-xs); padding: .2em .5em; border-radius: 6px; border: 1px solid var(--success); background: color-mix(in srgb, var(--success) 14%, var(--bg)); overflow-wrap: anywhere; }
  @media (min-width: 901px) { .split-code { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr) !important; } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo } = React;
const { Box, Glow, Chip, Grid, Card, Btn, Field, Table, Flow, CompareTwo, ActivityBadge, Steps, Code } = UI;
const C = window.Cripto;
const A = C.ALFABETO;

/* ---------- Cesare a chiave numerica: helper locale ----------
   crypto.js ha solo cesareGeneralizzato(testo, a, b), che è il cifrario AFFINE (a·x + b).
   Qui "Cesare generalizzato" è una SERIE di spostamenti: la i-esima lettera si sposta di chiave[i mod n].
   Convenzione: la chiave avanza solo sulle lettere A-Z / a-z; spazi, cifre, punteggiatura e accenti
   si copiano senza consumare la chiave (la stessa di Cripto.vigenere). */
const mod26 = (n) => ((n % 26) + 26) % 26;
const pot26 = (n) => { let r = 1n; for (let i = 0; i < n; i++) r *= 26n; return r; };   // 26^n con BigInt (senza **, che Babel trasforma in Math.pow)
function seqTraccia(testo, chiave, decifra) {
  const k = chiave.map(mod26); let j = 0;
  return Array.from(String(testo)).map((ch) => {
    const code = ch.charCodeAt(0), up = code >= 65 && code <= 90, lo = code >= 97 && code <= 122;
    if ((!up && !lo) || !k.length) return { c: ch, lettera: false, out: ch };
    const base = up ? 65 : 97, kk = k[j % k.length], x = code - base, y = mod26(x + (decifra ? -kk : kk));
    const r = { c: ch, lettera: true, j, k: kk, x, y, out: String.fromCharCode(base + y) };
    j++; return r;
  });
}
const seq = (testo, chiave, decifra) => seqTraccia(testo, chiave, decifra).map(t => t.out).join('');
const parseChiave = (s) => String(s).split(/[\s,;.\-–]+/).filter(Boolean).map(Number).filter(n => Number.isFinite(n)).map(n => Math.trunc(n));
const serie = (k) => k.join('-');
const lettereChiave = (k) => k.map(n => A[mod26(n)]).join('');

/* ---------- componenti specifici del modulo ---------- */

// Righe: spostamento / chiaro / cifrato per ogni carattere. `upto` = quante lettere mostrare (le altre nascoste).
function Tabella({ testo, chiave, decifra, upto, corrente, max }) {
  const tr = useMemo(() => seqTraccia(testo, chiave, decifra), [testo, serie(chiave), decifra]);
  const lim = max || 40;
  let viste = 0;
  return (
    <div>
      <div className="leg" aria-hidden="true">
        <span><i className="k" />spostamento</span><span><i />{decifra ? 'cifrato' : 'in chiaro'}</span><span><i className="o" />{decifra ? 'in chiaro' : 'cifrato'}</span>
      </div>
      <div className="tab-seq mt" role="img" aria-label={'Testo ' + testo + ' con chiave ' + serie(chiave) + ': ' + seq(testo, chiave, decifra)}>
        {tr.slice(0, lim).map((t, i) => {
          if (!t.lettera) return <div key={i} className="cl sp" />;
          const nascosta = upto != null && viste >= upto;
          const cur = corrente != null && viste === corrente;
          viste++;
          return (
            <div key={i} className="cl">
              <div className={'c k' + (nascosta ? ' nv' : '')}>{t.k}</div>
              <div className={'c' + (cur ? ' cur' : '')}>{t.c}</div>
              <div className={'c o' + (nascosta ? ' nv' : '')}>{t.out}</div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function ChiaveBox({ chiave }) {
  return <span className="chiave-box" aria-label={'Chiave ' + serie(chiave)}>{chiave.map((n, i) => <b key={i}>{n}</b>)}</span>;
}

// Simulatore inline: testo, chiave a serie, cifra/decifra.
function SerieSim() {
  const [testo, setTesto] = useState('Ci vediamo domani alle otto');
  const [chiaveTxt, setChiaveTxt] = useState('3-1-4');
  const [modo, setModo] = useState('cifra');
  const chiave = parseChiave(chiaveTxt);
  const decifra = modo === 'decifra';
  const out = seq(testo, chiave, decifra);
  return (
    <div className="sim">
      <div className="sim-title">Simulatore · Cesare a chiave numerica</div>
      <Grid cols={2}>
        <div className="stack">
          <Field label="Testo" htmlFor="sim-testo"><textarea id="sim-testo" className="input" rows={2} value={testo} onChange={e => setTesto(e.target.value)} /></Field>
          <Field label="Chiave: numeri separati da trattino" htmlFor="sim-chiave">
            <input id="sim-chiave" className="input mono" value={chiaveTxt} onChange={e => setChiaveTxt(e.target.value)} inputMode="numeric" />
          </Field>
          <div className="row">
            <Btn variant={modo === 'cifra' ? 'primary' : ''} onClick={() => setModo('cifra')} aria-pressed={modo === 'cifra'}>Cifra</Btn>
            <Btn variant={modo === 'decifra' ? 'primary' : ''} onClick={() => setModo('decifra')} aria-pressed={modo === 'decifra'}>Decifra</Btn>
            <span className="small dim">{chiave.length ? <>Chiave letta: <ChiaveBox chiave={chiave} /></> : 'Scrivi almeno un numero.'}</span>
          </div>
        </div>
        <div className="stack">
          <div className="label xs muted">{decifra ? 'Testo in chiaro' : 'Testo cifrato'}</div>
          <div className="out big" aria-live="polite">{out || ' '}</div>
          {chiave.length ? <Tabella testo={testo} chiave={chiave} decifra={decifra} max={16} /> : null}
        </div>
      </Grid>
    </div>
  );
}

// Istogramma
function GraficoBarre({ valori, max, cls }) {
  return (
    <div>
      <div className={'freq ' + (cls || '')} role="img" aria-label="Istogramma delle frequenze delle lettere">
        {valori.map((v, i) => <div key={i} className="b"><i style={{ height: (100 * v / max) + '%' }} /></div>)}
      </div>
      <div className="freq-let" aria-hidden="true">{valori.map((v, i) => <span key={i}>{A[i]}</span>)}</div>
    </div>
  );
}

/* ---------- dati ---------- */

// Testo italiano di prova (senza accenti: la chiave a serie lavora sulle sole lettere A-Z).
const ITALIANO = C.senzaAccenti('La crittografia è l\'arte di nascondere il significato di un messaggio. Chi scrive trasforma le parole con una regola e una chiave, chi legge usa la stessa chiave per tornare al testo originale. Nei secoli questa idea è stata usata per proteggere lettere, ordini militari e segreti di stato, ma anche per giocare con gli amici. In una rete moderna ogni computer scambia continuamente informazioni con altri computer, e molte di queste informazioni devono restare riservate durante il viaggio attraverso i cavi e le onde radio. Quando scriviamo una password oppure inviamo un messaggio a un amico, i dati attraversano molti dispositivi che non conosciamo e che potrebbero leggerli. Per questo motivo la riservatezza non è un lusso ma una necessità, e chi progetta un sistema deve pensarci fin dall\'inizio.');
const CHIAVE_BASE = [3, 1, 4];
const ES = 'ATTACCO ALBA';
const CIF_ES = seq(ES, CHIAVE_BASE);
const solo = (t) => t.replace(/[^A-Za-z]/g, '').toUpperCase();

/* ---------- componenti con calcolo ---------- */

// Tabella delle chiavi possibili: 26^n.
function umano(sec) {
  if (sec < 1) return 'meno di un secondo';
  const f = (x) => Math.round(x).toLocaleString('it-IT');
  if (sec < 60) return f(sec) + ' secondi';
  if (sec < 3600) return f(sec / 60) + ' minuti';
  if (sec < 86400) return f(sec / 3600) + ' ore';
  if (sec < 86400 * 365) return f(sec / 86400) + ' giorni';
  return f(sec / (86400 * 365)) + ' anni';
}
function TabellaChiavi() {
  const righe = [1, 2, 3, 4, 6, 8, 10, 12].map(n => {
    const tot = pot26(n);
    return [n, tot.toLocaleString('it-IT'), umano(Number(tot) / 1e9)];
  });
  return <Table mono head={['Numeri nella chiave', 'Chiavi possibili (26^n)', 'Tempo a 1 miliardo di chiavi al secondo']} rows={righe} hlRow={0} />;
}

// Le frequenze si spalmano al crescere della lunghezza della chiave.
const CHIAVI_LUNGHE = { 1: [7], 2: [5, 12], 3: [3, 1, 4], 5: [3, 1, 4, 1, 5], 8: [3, 1, 4, 1, 5, 9, 2, 6], 12: [3, 1, 4, 1, 5, 9, 2, 6, 5, 3, 5, 8] };
function Spalma() {
  const [n, setN] = useState(1);
  const chiave = CHIAVI_LUNGHE[n];
  const cifrato = useMemo(() => seq(ITALIANO, chiave), [n]);
  const f = useMemo(() => C.frequenze(cifrato).percentuali, [n]);
  const ic = useMemo(() => C.indiceCoincidenza(cifrato), [n]);
  const mx = f.reduce((m, v, i) => (v > f[m] ? i : m), 0);
  return (
    <div className="sim">
      <div className="row-between">
        <div className="sim-title">Frequenze del testo cifrato</div>
        <span className="mono xs muted">{solo(cifrato).length} lettere</span>
      </div>
      <div className="row" role="group" aria-label="Lunghezza della chiave">
        {[1, 2, 3, 5, 8, 12].map(x => <Btn key={x} small variant={n === x ? 'primary' : ''} aria-pressed={n === x} onClick={() => setN(x)}>{x} {x === 1 ? 'numero' : 'numeri'}</Btn>)}
      </div>
      <GraficoBarre valori={f} max={14} cls="cif" />
      <div className="row-between">
        <span className="small">Chiave: <ChiaveBox chiave={chiave} /></span>
        <span className="small dim">Picco: <span className="mono hl">{A[mx]} {f[mx].toFixed(1)}%</span> · indice di coincidenza <span className="mono hl">{ic.toFixed(3)}</span></span>
      </div>
      <p className="xs muted">Italiano: la lettera più frequente supera l'11% e l'indice di coincidenza vale circa 0,074. Un testo di lettere a caso arriva a 0,038.</p>
    </div>
  );
}

// Con la lunghezza nota, ogni colonna è un Cesare semplice: si stima lo spostamento di ciascuna.
function migliorSpostamento(col) {
  let m = 0, ms = Infinity;
  for (let s = 0; s < 26; s++) { const p = C.punteggioItaliano(C.cesareDecifra(col, s)); if (p < ms) { ms = p; m = s; } }
  return m;
}
function Colonne() {
  const cifrato = useMemo(() => seq(ITALIANO, CHIAVE_BASE), []);
  const lettere = useMemo(() => solo(cifrato), [cifrato]);
  const [n, setN] = useState(3);
  const cols = useMemo(() => Array.from({ length: n }, (_, i) => lettere.split('').filter((_, p) => p % n === i).join('')), [n]);
  const stima = useMemo(() => cols.map(migliorSpostamento), [n]);
  const prova = seq(cifrato.slice(0, 70), stima, true);
  const righe = 4;
  return (
    <div className="sim">
      <div className="row-between">
        <div className="sim-title">Una colonna alla volta</div>
        <span className="mono xs muted">{lettere.length} lettere cifrate</span>
      </div>
      <div className="row">
        <Field label={'Lunghezza ipotizzata della chiave: ' + n} className="grow"><input type="range" min="1" max="6" value={n} onChange={e => setN(+e.target.value)} aria-label="Lunghezza ipotizzata" /></Field>
      </div>
      <div className="griglia-col" style={{ gridTemplateColumns: 'repeat(' + n + ', minmax(0, 1fr))', maxWidth: (n * 3.2) + 'rem' }} aria-label="Lettere del cifrato disposte in colonne">
        {cols.map((_, i) => <div key={'h' + i} className="h">col. {i + 1}</div>)}
        {Array.from({ length: righe * n }, (_, p) => <div key={p} className={'g p' + (p % n % 3)}>{lettere[p]}</div>)}
      </div>
      <p className="small">Spostamento stimato per colonna con le frequenze: <ChiaveBox chiave={stima} /></p>
      <div className="out" aria-live="polite">{prova}…</div>
      <p className="xs muted">Con la lunghezza giusta (e con i suoi multipli) il testo si legge; con una lunghezza sbagliata resta incomprensibile.</p>
    </div>
  );
}

// Forza bruta con chiave di 2 numeri e parola probabile.
function ParolaProbabile() {
  const iniziale = useMemo(() => seq('Il bonifico parte domani mattina, controlla il conto!', [7, 2]), []);
  const [cifrato, setCifrato] = useState(iniziale);
  const [parola, setParola] = useState('domani');
  const { trovate, ms } = useMemo(() => {
    const t0 = performance.now(), r = [], p = parola.trim().toLowerCase();
    if (p) for (let a = 0; a < 26; a++) for (let b = 0; b < 26; b++) {
      const t = seq(cifrato, [a, b], true);
      if (t.toLowerCase().includes(p)) r.push({ chiave: a + '-' + b, testo: t });
    }
    return { trovate: r, ms: performance.now() - t0 };
  }, [cifrato, parola]);
  return (
    <div className="sim">
      <div className="row-between">
        <div className="sim-title">676 chiavi, una parola probabile</div>
        <span className="mono xs muted">676 chiavi provate in {ms.toFixed(1)} ms</span>
      </div>
      <Grid cols={2}>
        <Field label="Testo cifrato (chiave di 2 numeri)" htmlFor="pp-in"><textarea id="pp-in" className="input mono" rows={2} value={cifrato} onChange={e => setCifrato(e.target.value)} /></Field>
        <Field label="Parola che pensi sia nel messaggio" htmlFor="pp-par"><input id="pp-par" className="input mono" value={parola} onChange={e => setParola(e.target.value)} /></Field>
      </Grid>
      <div className="stack">
        {trovate.length === 0 ? <p className="small muted">Nessuna chiave produce un testo con «{parola}».</p> : null}
        {trovate.slice(0, 3).map(t => <div key={t.chiave} className="match"><b>{t.chiave}</b> → {t.testo}</div>)}
        {trovate.length > 3 ? <p className="xs muted">… e altre {trovate.length - 3} chiavi.</p> : null}
      </div>
      <div className="row"><Btn small variant="ghost" onClick={() => { setCifrato(iniziale); setParola('domani'); }}>Ripristina</Btn></div>
    </div>
  );
}

// Traccia di una lettera attraverso le operazioni del codice PHP.
function TracciaChiave() {
  const [c, setC] = useState('X');
  const [kTxt, setKTxt] = useState('3-1-4');
  const [j, setJ] = useState(4);
  const chiave = parseChiave(kTxt).map(mod26), n = chiave.length;
  const ch = (c || ' ')[0];
  const maius = ch >= 'A' && ch <= 'Z', minus = ch >= 'a' && ch <= 'z';
  let corpo;
  if (!n) corpo = <p className="small dim">La chiave è vuota: il codice restituisce il testo com'è.</p>;
  else if (!maius && !minus) corpo = <p className="small dim">«{ch}» non è una lettera: il codice la copia così com'è e <b>$j non cambia</b>.</p>;
  else {
    const base = maius ? 65 : 97, o = ch.charCodeAt(0), x = o - base, idx = j % n, s = chiave[idx], tot = x + s, m = tot % 26;
    const righe = [
      ['$j % $n  →  ' + j + ' % ' + n, idx],
      ['$chiave[' + idx + ']  (lo spostamento)', s],
      ['ord(\'' + ch + '\') − ' + base + '  (posizione)', x],
      ['+ $s  →  ' + x + ' + ' + s, tot],
      ['% 26  →  ' + tot + ' % 26', m],
      ['chr(' + m + ' + ' + base + ')', '\'' + String.fromCharCode(m + base) + '\''],
    ];
    corpo = <table className="table mono"><tbody>{righe.map((r, i) => <tr key={i}><td>{r[0]}</td><td className="hl">{r[1]}</td></tr>)}</tbody></table>;
  }
  return (
    <div className="sim">
      <div className="sim-title">Una lettera, passo per passo</div>
      <div className="row">
        <Field label="Lettera"><input className="input mono" style={{ width: '4.5em' }} maxLength={1} value={c} onChange={e => setC(e.target.value.slice(-1))} aria-label="Lettera" /></Field>
        <Field label="Chiave"><input className="input mono" style={{ width: '7em' }} value={kTxt} onChange={e => setKTxt(e.target.value)} aria-label="Chiave" /></Field>
        <Field label={'Lettere già cifrate ($j): ' + j}><input type="range" min="0" max="12" value={j} onChange={e => setJ(+e.target.value)} aria-label="Lettere già cifrate" /></Field>
      </div>
      {corpo}
    </div>
  );
}

/* ---------- codice PHP ---------- */

const CODICE_SERIE = `<?php
function cesareGeneralizzato(string $testo, array $chiave): string {
    $n = count($chiave);                    // quanti numeri ha la chiave
    if ($n === 0) { return $testo; }        // chiave vuota: niente da fare
    $chiave = array_map(fn($x) => (($x % 26) + 26) % 26, $chiave);
    $risultato = '';
    $j = 0;                                 // quante lettere ho già cifrato
    for ($i = 0; $i < strlen($testo); $i++) {
        $c = $testo[$i];
        if ($c >= 'A' && $c <= 'Z') { $base = 65; }
        elseif ($c >= 'a' && $c <= 'z') { $base = 97; }
        else { $risultato .= $c; continue; }   // non è una lettera: la chiave NON avanza
        $s = $chiave[$j % $n];              // lo spostamento di questa lettera
        $risultato .= chr((ord($c) - $base + $s) % 26 + $base);
        $j++;                               // alla prossima lettera, il numero dopo
    }
    return $risultato;
}

echo cesareGeneralizzato('ATTACCO', [3, 1, 4]);`;
const SPIEGA_SERIE = [
  'Il tag di apertura: da qui in poi è codice PHP.',
  'La chiave non è più un intero ma un array di interi, per esempio [3, 1, 4].',
  'count() dà la lunghezza della chiave: servirà per ricominciare da capo.',
  'Con una chiave vuota il resto dell\'operazione darebbe una divisione per zero: si esce subito.',
  'Come nel modulo 1, ogni numero va portato tra 0 e 25 (anche i negativi). array_map lo fa per tutti i numeri.',
  'Il risultato parte vuoto e si costruisce lettera per lettera.',
  '$j conta le lettere cifrate, non i caratteri letti: è lui che sceglie il numero della chiave.',

// ... (estratto)
$j = 0;
for ($i = 0; $i < strlen($testo); $i++) {
    $c = $testo[$i];
    // ... determina $base, o copia e continue
    $s = $chiave[$j % $n];
    $risultato .= chr((ord($c) - $base + $s) % 26 + $base);

}`;
