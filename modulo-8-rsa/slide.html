<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useEffect } = React;
const { Box, Glow, Chip, Grid, Card, Btn, Field, Table, Flow, CompareTwo, ActivityBadge, Steps, Code } = UI;
const { num, modB, fmt, CampoNum, TabInverso, TabPotenza } = MatUI;
const R = window.RsaUI;
const C = window.Cripto;

/* ---------- dati dell'esempio, tutti da crypto.js ---------- */
const K = C.rsa.genera(61, 53, 17);                                   // n=3233, phi=3120, e=17, d=2753
const M0 = 65n;
const C0 = C.rsa.cifra(M0, K.pub);                                    // 2790
const S0 = C.rsa.firma(M0, K.priv);                                   // 588
const ED = K.e * K.d;                                                 // 46801
const KED = (ED - 1n) / K.phi;                                        // 15
const PAROLA = 'CIAO';
const COD = R.codificaTesto(PAROLA, K.n);                             // blocchi di 2 lettere
const COD_CIF = COD.blocchi.map(b => C.rsa.cifra(b, K.pub));
const COD_DEC = COD_CIF.map(c => C.rsa.decifra(c, K.priv));
const CIFRE_2048 = (BigInt(1) << 2048n).toString().length;            // cifre decimali di 2^2048
const CIFRE_RADICE = (BigInt(1) << 1023n).toString().length;          // ~ sqrt(2^2048) / 2

/* ---------- componenti ---------- */

function PersoneChiavi() {
  const [n, setN] = useState(30);
  return (
    <div className="sim">
      <div className="sim-title">Quante chiavi servono?</div>
      <Grid cols={2}>
        <div className="stack">
          <Field label={'Persone: ' + n}><input type="range" min="2" max="200" value={n} onChange={e => setN(+e.target.value)} aria-label="Persone" /></Field>
          <p>Con la crittografia simmetrica ogni coppia ha una chiave segreta: <span className="mono hl">n(n−1)/2 = {fmt(n * (n - 1) / 2)}</span> chiavi.</p>
        </div>
        <div className="stack">
          <p>Con RSA ogni persona ha <b className="hl">una</b> coppia di chiavi: <span className="mono hl">{n}</span> coppie in tutto. E la chiave pubblica non è segreta.</p>
        </div>
      </Grid>
    </div>
  );
}

function RsaLab() {
  const [p, setP] = useState('61'), [q, setQ] = useState('53'), [e, setE] = useState('17');
  const [tab, setTab] = useState('cifra');
  const [modo, setModo] = useState('numero');
  const [msg, setMsg] = useState('65');
  const [testo, setTesto] = useState('CIAO');
  const P = num(p), Q = num(q), E = num(e);
  let K1 = null, err = null;
  try { if (P === null || Q === null || E === null) throw new RangeError('Scrivi p, q ed e (numeri interi).'); K1 = C.rsa.genera(P, Q, E); }
  catch (x) { err = x.message; }
  let voci = null, errMsg = null, L = 0;
  if (K1) {
    if (modo === 'numero') { const m = num(msg); if (m === null || m < 0n) errMsg = 'Scrivi un numero intero non negativo.'; else if (m >= K1.n) errMsg = 'Il messaggio deve essere minore di n = ' + fmt(K1.n) + '.'; else voci = [m]; }
    else { const cd = R.codificaTesto(testo, K1.n); if (!cd) errMsg = 'n è troppo piccolo per codificare le lettere: scegli primi più grandi.'; else if (!cd.blocchi.length) errMsg = 'Scrivi almeno una lettera.'; else { voci = cd.blocchi; L = cd.L; } }
  }
  const conv = (v) => modo === 'testo' ? R.decodificaBlocchi([v], L) : '';
  let corpo = null;
  if (K1 && voci) {
    if (tab === 'cifra') {
      const cif = voci.map(m => C.rsa.cifra(m, K1.pub)), dec = cif.map(c => C.rsa.decifra(c, K1.priv));
      corpo = (
        <div className="stack">
          <p className="eq">Cifratura: c = m^e mod n → {voci.map((m, i) => <span key={i}>{i ? ' · ' : ''}{fmt(m)}^{fmt(K1.e)} mod {fmt(K1.n)} = <b className="hl">{fmt(cif[i])}</b></span>)}</p>
          <p className="eq">Decifratura: m = c^d mod n → {cif.map((c, i) => <span key={i}>{i ? ' · ' : ''}{fmt(c)}^{fmt(K1.d)} mod {fmt(K1.n)} = <b className="t-success">{fmt(dec[i])}</b></span>)}</p>
          {modo === 'testo' ? <p className="small">Cifrato da trasmettere: <span className="mono hl">{cif.map(fmt).join(' ')}</span> · Testo recuperato: <span className="mono hl">{R.decodificaBlocchi(dec, L)}</span></p> : null}
        </div>
      );
    } else {
      const fir = voci.map(m => C.rsa.firma(m, K1.priv)), ok = fir.map((s, i) => C.rsa.verifica(s, voci[i], K1.pub));
      corpo = (
        <div className="stack">
          <p className="eq">Firma con d: s = m^d mod n → {voci.map((m, i) => <span key={i}>{i ? ' · ' : ''}{fmt(m)}^{fmt(K1.d)} mod {fmt(K1.n)} = <b className="hl">{fmt(fir[i])}</b></span>)}</p>
          <p className="eq">Verifica con e: s^e mod n → {fir.map((s, i) => <span key={i}>{i ? ' · ' : ''}{fmt(s)}^{fmt(K1.e)} mod {fmt(K1.n)} = <b className="t-success">{fmt(C.potenzaModulare(s, K1.e, K1.n))}</b> {ok[i] ? '✓' : '✗'}</span>)}</p>
        </div>
      );
    }
  }
  return (
    <div className="sim">
      <div className="sim-title">Calcolatore RSA giocattolo</div>
      <div className="tre">
        <CampoNum label="p (primo)" value={p} onChange={setP} max={7} />
        <CampoNum label="q (primo)" value={q} onChange={setQ} max={7} />
        <CampoNum label="e (coprimo con φ)" value={e} onChange={setE} max={7} />
      </div>
      {err ? <div className="feedback ko" role="status">{err}</div> : (
        <p className="eq small">n = <b className="hl">{fmt(K1.n)}</b> · φ(n) = <b className="hl">{fmt(K1.phi)}</b> · d = <b className="hl">{fmt(K1.d)}</b> → pubblica ({fmt(K1.e)}, {fmt(K1.n)}) · privata ({fmt(K1.d)}, {fmt(K1.n)})</p>
      )}
      {K1 ? (<>
        <div className="row">
          <div className="tabs" role="group" aria-label="Operazione">
            <Btn small variant={tab === 'cifra' ? 'primary' : ''} aria-pressed={tab === 'cifra'} onClick={() => setTab('cifra')}>Cifra e decifra</Btn>
            <Btn small variant={tab === 'firma' ? 'primary' : ''} aria-pressed={tab === 'firma'} onClick={() => setTab('firma')}>Firma e verifica</Btn>
          </div>
          <div className="tabs" role="group" aria-label="Tipo di messaggio">
            <Btn small variant={modo === 'numero' ? 'primary' : ''} aria-pressed={modo === 'numero'} onClick={() => setModo('numero')}>Numero</Btn>
            <Btn small variant={modo === 'testo' ? 'primary' : ''} aria-pressed={modo === 'testo'} onClick={() => setModo('testo')}>Parola</Btn>
          </div>
        </div>
        {modo === 'numero'
          ? <CampoNum label="Messaggio m (minore di n)" value={msg} onChange={setMsg} max={20} />
          : <Field label="Parola (solo lettere)" htmlFor="rl-testo"><input id="rl-testo" className="input mono" value={testo} onChange={e2 => setTesto(e2.target.value.slice(0, 30))} /></Field>}
        {errMsg ? <div className="feedback ko" role="status">{errMsg}</div> : corpo}
      </>) : null}
    </div>
  );
}

function Hash() {
  const [t, setT] = useState('Verifica di Sistemi e Reti: voto 8');
  const [h, setH] = useState('');
  const [nonDisp, setNonDisp] = useState(false);
  useEffect(() => {
    let vivo = true;
    try {
      if (!window.crypto || !window.crypto.subtle) { setNonDisp(true); return; }
      window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)).then(buf => {
        if (vivo) setH(Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join(''));
      }).catch(() => setNonDisp(true));
    } catch (x) { setNonDisp(true); }
    return () => { vivo = false; };
  }, [t]);
  return (
    <div className="sim">
      <div className="sim-title">Impronta SHA-256 del documento</div>
      <Field label="Documento" htmlFor="hash-in"><textarea id="hash-in" className="input" rows={2} value={t} onChange={e => setT(e.target.value)} /></Field>
      {nonDisp ? <p className="small t-warn">Il browser non permette il calcolo di SHA-256 da questa pagina (serve un contesto sicuro).</p> :
        <div className="out mono" style={{ fontSize: 'var(--fs-xs)', overflowWrap: 'anywhere' }} aria-live="polite">{h || ' '}</div>}
      <p className="small muted">Cambia una sola lettera: l'impronta cambia completamente. Sono 256 bit, qualunque sia la lunghezza del documento.</p>
    </div>
  );
}

function CalcAttacco() {
  const [n, setN] = useState('3233');
  const [e, setE] = useState('17');
  const [c, setC] = useState('2790');
  const [ris, setRis] = useState(null);
  const N = num(n), E = num(e), Cc = num(c);
  const ok = N !== null && E !== null && Cc !== null && N > 3n && N < 100000000000000n;
  const attacca = () => {
    const t0 = performance.now();
    const f = C.fattorizza(N);
    const ms = performance.now() - t0;
    if (f.fattori.length !== 2) { setRis({ errore: 'n non è il prodotto di due primi (fattori trovati: ' + f.fattori.map(String).join(' · ') + ').', ...f, ms }); return; }
    const phi = (f.fattori[0] - 1n) * (f.fattori[1] - 1n), d = C.inversoModulare(E, phi);
    if (d === null) { setRis({ errore: 'e non è coprimo con φ(n): non è una chiave RSA valida.', ...f, ms }); return; }
    setRis({ ...f, ms, phi, d, m: C.potenzaModulare(Cc, d, N) });
  };
  const pre = (a, b, cc) => () => { setN(String(a)); setE(String(b)); setC(String(cc)); setRis(null); };
  return (
    <div className="sim">
      <div className="sim-title">Attacco: rompere una chiave piccola</div>
      <div className="tre">
        <CampoNum label="n (pubblico)" value={n} onChange={v => { setN(v); setRis(null); }} max={14} />
        <CampoNum label="e (pubblico)" value={e} onChange={v => { setE(v); setRis(null); }} max={14} />
        <CampoNum label="c (intercettato)" value={c} onChange={v => { setC(v); setRis(null); }} max={14} />
      </div>
      <div className="row">
        <Btn small onClick={pre(3233, 17, 2790)}>3233</Btn>
        <Btn small onClick={() => { const p = R.prossimoPrimo(10007), q = R.prossimoPrimo(10501), k = C.rsa.genera(p, q, 65537); setN(String(k.n)); setE('65537'); setC(String(C.rsa.cifra(123456, k.pub))); setRis(null); }}>n di 9 cifre</Btn>
        <Btn small onClick={() => { const p = R.prossimoPrimo(1000003), q = R.prossimoPrimo(1000100), k = C.rsa.genera(p, q, 65537); setN(String(k.n)); setE('65537'); setC(String(C.rsa.cifra(123456, k.pub))); setRis(null); }}>n di 13 cifre</Btn>
        <Btn variant="primary" onClick={attacca} disabled={!ok}>Fattorizza n</Btn>
      </div>
      {!ok ? <p className="small muted">Servono tre interi; n tra 4 e 99 999 999 999 999 (oltre sarebbe troppo lento da provare qui).</p> : null}
      {ris && ris.errore ? <div className="feedback ko" role="status">{ris.errore}</div> : null}
      {ris && !ris.errore ? (
        <div className="stack">
          <p className="eq">n = <b className="hl">{fmt(ris.fattori[0])} · {fmt(ris.fattori[1])}</b> <span className="muted">({fmt(ris.tentativi)} divisioni, {ris.ms.toFixed(1)} ms)</span></p>
          <p className="eq">φ(n) = {fmt(ris.fattori[0] - 1n)} · {fmt(ris.fattori[1] - 1n)} = {fmt(ris.phi)} → d = inverso di {fmt(E)} = <b className="hl">{fmt(ris.d)}</b></p>
          <p className="eq">m = c^d mod n = <b className="t-success">{fmt(ris.m)}</b> <span className="muted">(messaggio decifrato senza la chiave privata)</span></p>
        </div>
      ) : null}
    </div>
  );
}

function DaLibro() {
  const [t, setT] = useState('SI');
  const s = C.normalizza(t).replace(/[^A-Z]/g, '').slice(0, 12);
  const dizionario = useMemo(() => Array.from({ length: 26 }, (_, i) => ({ l: String.fromCharCode(65 + i), c: C.rsa.cifra(i + 1, K.pub) })), []);
  const cif = s.split('').map(ch => C.rsa.cifra(ch.charCodeAt(0) - 64, K.pub));
  const inv = Object.fromEntries(dizionario.map(x => [String(x.c), x.l]));
  return (
    <div className="sim">
      <div className="sim-title">RSA «da libro» lettera per lettera (n = 3233, e = 17)</div>
      <Field label="Messaggio" htmlFor="dl-in"><input id="dl-in" className="input mono" value={t} onChange={e => setT(e.target.value.slice(0, 12))} /></Field>
      <p className="eq">Cifrato: <b className="hl">{cif.map(fmt).join(' ')}</b></p>
      <p className="eq">L'attaccante cifra tutte le 26 lettere con la chiave <i>pubblica</i> e confronta: <b className="t-danger">{cif.map(c => inv[String(c)] || '?').join('')}</b></p>
      <div className="lista-x" aria-label="Dizionario di tutte le lettere cifrate">
        {dizionario.map(x => <span key={x.l} className={s.includes(x.l) ? 'si' : ''}>{x.l}→{x.c}</span>)}
      </div>
    </div>
  );
}

/* ---------- codice PHP ---------- */
const mk = (righe) => ({ code: righe.map(r => r[0]).join('\n'), explain: righe.map(r => r[1] || '') });

const PHP_CHIAVI = mk([
  ['<?php', 'Apertura PHP. Il programma usa solo interi: valido per numeri piccoli.'],
  ['function mcd(int $a, int $b): int {', 'Algoritmo di Euclide: serve a verificare che e sia coprimo con φ(n).'],
  ['    while ($b !== 0) { [$a, $b] = [$b, $a % $b]; }', 'Si scala: il divisore diventa dividendo, il resto diventa divisore. Si ferma a resto 0.'],
  ['    return $a;', 'L\'ultimo valore non nullo è il MCD.'],
  ['}', ''],
  ['', ''],
  ['function inverso(int $e, int $phi): int {', 'Inverso di e modulo φ, con Euclide esteso.'],
  ['    [$r0, $r1] = [$phi, $e];', 'r tiene i resti: si parte da φ e da e.'],
  ['    [$t0, $t1] = [0, 1];', 't tiene il coefficiente di e: r = φ·s + e·t (di s non ci serve nulla).'],
  ['    while ($r1 !== 0) {', 'Finché il resto non è zero.'],
  ['        $q = intdiv($r0, $r1);', 'Quoziente intero della divisione.'],
  ['        [$r0, $r1] = [$r1, $r0 - $q * $r1];', 'Nuovo resto: r0 − q·r1.'],
  ['        [$t0, $t1] = [$t1, $t0 - $q * $t1];', 'Lo stesso passo sui coefficienti t.'],
  ['    }', 'Alla fine r0 vale il MCD (1 se e e φ sono coprimi).'],
  ['    return (($t0 % $phi) + $phi) % $phi;', 't può essere negativo: la doppia % lo riporta tra 0 e φ−1. Questo è d.'],
  ['}', ''],
  ['', ''],
  ['function generaChiavi(int $p, int $q, int $e): array {', 'Dati due primi e un esponente pubblico, costruisce le chiavi.'],
  ['    $n = $p * $q;', 'Modulo: 61 · 53 = 3233.'],
  ['    $phi = ($p - 1) * ($q - 1);', 'φ(n) = 60 · 52 = 3120.'],
  ['    if (mcd($e, $phi) !== 1) { throw new InvalidArgumentException(\'e non è coprimo con phi\'); }', 'Se e non è coprimo con φ non esiste l\'inverso: errore.'],
  ['    $d = inverso($e, $phi);', 'Esponente privato: 2753.'],
  ['    return [\'pub\' => [$e, $n], \'priv\' => [$d, $n]];', 'Le due chiavi: la pubblica si diffonde, la privata resta al proprietario.'],
  ['}', ''],
]);

const PHP_CIFRA = mk([
  ['<?php', 'Si riusa potenzaModulare() del modulo 7 (square-and-multiply).'],
  ['function cifra(int $m, array $pub): int {', 'Chi cifra conosce solo la chiave pubblica [e, n].'],
  ['    return potenzaModulare($m, $pub[0], $pub[1]);', 'c = m^e mod n. Con m = 65 si ottiene 2790.'],
  ['}', ''],
  ['', ''],
  ['function decifra(int $c, array $priv): int {', 'Chi decifra usa la chiave privata [d, n].'],
  ['    return potenzaModulare($c, $priv[0], $priv[1]);', 'm = c^d mod n. Con c = 2790 si torna a 65. La firma è la stessa operazione sul messaggio.'],
  ['}', ''],
  ['', ''],
  ['function attacco(int $n, int $e): int {', 'L\'attaccante conosce n ed e (pubblici) e vuole d.'],
  ['    for ($p = 2; $p * $p <= $n; $p++) {', 'Prova i divisori fino a √n: è la fattorizzazione ingenua.'],
  ['        if ($n % $p === 0) {', 'Trovato un fattore.'],
  ['            $q = intdiv($n, $p);', 'L\'altro fattore.'],
  ['            return inverso($e, ($p - 1) * ($q - 1));', 'Con p e q calcola φ(n) e poi d, come farebbe il proprietario.'],
  ['        }', ''],
  ['    }', ''],
  ['    throw new InvalidArgumentException(\'n è primo: non è una chiave RSA\');', 'Nessun divisore: n è primo.'],
  ['}', ''],
]);

/* ---------- le slide ---------- */

const slides = [
  { copertina: true, sezione: 'Apertura', titolo: 'RSA',
    sottotitolo: 'Il cifrario a chiave pubblica: chiavi, cifratura, firma digitale e perché non si rompe.',
    note: ['Modulo centrale sulla crittografia asimmetrica. Si presume di aver visto il modulo 7 (modulo, MCD, Euclide esteso, potenza modulare); dove serve si rimanda alle sue slide.', 'Esempio guida: p = 61, q = 53, e = 17, messaggio 65. Ogni numero mostrato è calcolato dal motore del progetto.'] },

  { sezione: 'Il problema', titolo: 'Il problema della chiave condivisa',
    contenuto: () => (
      <div className="stack">
        <p className="lead">Con un cifrario simmetrico mittente e destinatario hanno <span className="hl">la stessa chiave</span>. Ma come se la scambiano, se il canale non è sicuro?</p>
        <PersoneChiavi />
        <Box type="warn" title="Due problemi">Distribuire la chiave in modo sicuro. Gestire un numero di chiavi che cresce con il quadrato delle persone.</Box>
      </div>
    ),
    note: 'Riprendete DES: tutta la sicurezza sta nella chiave, che però va comunicata. Il cursore mostra la crescita quadratica del numero di chiavi simmetriche. La soluzione di RSA: due chiavi diverse, una pubblica e una privata.' },

  { sezione: 'Storia', titolo: 'Come nasce la chiave pubblica',
    contenuto: () => (
      <div className="stack-lg">
        <div className="tempo">
          <div className="ev"><div className="anno">1973</div><p>Clifford Cocks, al GCHQ britannico, ideò un sistema equivalente a RSA. Rimase segreto fino al 1997.</p></div>
          <div className="ev"><div className="anno">1976</div><p>Diffie e Hellman (con Merkle) pubblicano «New Directions in Cryptography»: scambio di chiavi su canale pubblico.</p></div>
          <div className="ev"><div className="anno">1977</div><p>Rivest, Shamir e Adleman, al MIT, inventano RSA. Descrizione formale nel 1978.</p></div>
          <div className="ev"><div className="anno">2000</div><p>Scade il brevetto statunitense di RSA: l'algoritmo diventa libero.</p></div>
        </div>
        <Box type="info" title="Il nome">RSA sono le iniziali dei tre autori: Rivest, Shamir, Adleman.</Box>
      </div>

  { sezione: 'Chiavi', titolo: 'Generare le chiavi in 5 passi',

          { title: '3. Calcola φ(n)', content: <p className="eq">φ(n) = (p − 1)(q − 1) = 60 · 52 = <b className="hl">{String(K.phi)}</b> <span className="small muted">(segreto: serve p e q per calcolarlo)</span></p> },
          { title: '4. Scegli e coprimo con φ(n)', content: <p className="eq">e = <b className="hl">17</b>: MCD(17, {String(K.phi)}) = <b className="t-success">{String(C.mcd(17n, K.phi))}</b> <span className="small muted">(1 &lt; e &lt; φ; nella pratica spesso 65537)</span></p> },
          { title: '5. Calcola d, inverso di e', content: <p className="eq">d = inverso di 17 modulo {String(K.phi)} = <b className="hl">{String(K.d)}</b><br />Verifica: 17 · {String(K.d)} = {String(ED)} = {String(KED)} · {String(K.phi)} + {String(ED % K.phi)}</p> },
        ]} />

        </div>
      </div>
    ),
    note: 'Cinque passi da ripetere con le frecce. Dopo il passo 5 si buttano p, q e φ(n): la privata contiene solo d e n. Sottolineate che n ed e sono pubblici: la sicurezza sta nell\'impossibilità di ricavare φ(n) senza conoscere p e q. I primi reali sono lunghi circa 1024 bit ciascuno.' },

  { sezione: 'Messaggi', titolo: 'Dalle parole ai numeri',

  { sezione: 'Perché funziona', titolo: 'Perché funziona: l\'intuizione di Eulero',
    contenuto: () => (
      <div className="stack">
        <Box type="info" title="Dal modulo 7">Se m è coprimo con n: <span className="mono hl">m^φ(n) ≡ 1 (mod n)</span>.</Box>
        <p className="eq">e · d = 17 · {String(K.d)} = {String(ED)} = <b className="hl">1 + {String(KED)} · {String(K.phi)}</b></p>
        <Glow>
          <p className="center eq">(m^e)^d = m^(e·d) = m^(1 + {String(KED)}·φ) = m · (m^φ)^{String(KED)} ≡ m · 1^{String(KED)} = <span className="hl">m</span></p>
        </Glow>
        <p className="small muted">Per questo d si sceglie come inverso di e modulo φ(n): la decifratura annulla la cifratura. Il caso (rarissimo) di m non coprimo con n funziona comunque: la dimostrazione completa usa il teorema cinese del resto.</p>
      </div>
    ),
    note: 'Non serve una dimostrazione formale: la catena di uguaglianze è il cuore. Dalla scelta di d segue che e·d = 1 + k·φ(n); la proprietà di Eulero fa sparire la parte con φ. Per i numeri dell\'esempio k vale 15. Studenti curiosi: il caso m multiplo di p o q si dimostra con il teorema cinese del resto, fuori programma.' },

          <Card tone="success"><h3>Rimedio: il padding</h3><ul className="small"><li><b>OAEP</b> per cifrare: aggiunge casualità e struttura.</li><li><b>PSS</b> per firmare.</li><li>Si usa sempre una libreria collaudata (OpenSSL), mai codice scritto a mano.</li></ul></Card>

  { sezione: 'Futuro', titolo: 'Il computer quantistico e l\'algoritmo di Shor',

      <div className="stack-lg">
        <Grid cols={2} stretch>
          <Card tone="info"><h3>L'algoritmo</h3><p className="small">Nel 1994 Peter Shor mostrò che un computer quantistico abbastanza grande potrebbe fattorizzare n in tempo polinomiale: RSA non reggerebbe.</p></Card>
          <Card tone="accent"><h3>La situazione</h3><p className="small">I computer quantistici attuali sono lontanissimi dalle dimensioni richieste: le stime parlano di un numero enorme di qubit fisici corretti dagli errori. Nessuno rompe oggi RSA-2048.</p></Card>
        </Grid>
        <Box type="tip" title="Cosa si fa">Il NIST ha standardizzato nel 2024 i primi algoritmi di crittografia post-quantistica (FIPS 203, 204, 205) e promuove la transizione graduale. Chi deve proteggere dati per molti anni inizia a pianificarla.</Box>
      </div>
    ),
    note: 'Tono misurato: la minaccia è reale in prospettiva ma non attuale. Shor (1994) riguarda fattorizzazione e logaritmo discreto: colpisce RSA, Diffie-Hellman e curve ellittiche. I cifrari simmetrici come AES sono toccati in modo molto più lieve. Standard NIST dell\'agosto 2024: ML-KEM (FIPS 203), ML-DSA (FIPS 204), SLH-DSA (FIPS 205). Evitate previsioni su date precise.' },

  { sezione: 'Verso la pratica', titolo: 'Ponte: la crittografia ibrida',
    contenuto: () => (
