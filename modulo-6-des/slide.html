const { useState, useMemo, useEffect, useRef } = React;

const V = window.VisteDES;

const BitsJ = (p) => V.Bits(p.label, p.bits, p);
const SDT = C.sdes.tabelle, DT = C.des.tabelle;

/* ---------- vettori di prova (tutti i numeri escono da crypto.js) ---------- */
const TV_KEY = '133457799BBCDFF1', TV_PT = '0123456789ABCDEF';
const TD = C.des.traccia(TV_PT, TV_KEY);                 // output atteso 85E813540F0AB405
const SD_KEY = '1010000010', SD_PT = '01110010';
const TS = C.sdes.traccia(SD_PT, SD_KEY);                // output atteso 01110111
const TSD = C.sdes.traccia(TS.output, SD_KEY, true);
const PASSI_SDES = V.sdesPassi(TS, false);
const hexDiGruppi = (bit, n) => V.raggruppa(bit, n);
const pesoUno = V.pesoUno;
const flip = (bit, i) => bit.split('').map((b, j) => (j === i ? (b === '1' ? '0' : '1') : b)).join('');

// Griglia di una tabella DES (r righe x c colonne)
function Griglia({ tab, c, nome }) {
  const righe = []; for (let i = 0; i < tab.length; i += c) righe.push(tab.slice(i, i + c));
  return <div className="scrollx"><table className="table mono center grid-tab"><thead>{nome ? <tr><th colSpan={c}>{nome}</th></tr> : null}</thead><tbody>{righe.map((r, i) => <tr key={i}>{r.map((v, j) => <td key={j}>{v}</td>)}</tr>)}</tbody></table></div>;
}

/* ---------- Feistel giocattolo: 2 metà da 8 bit, 4 round ---------- */
const K_TOY = [0x3A, 0xC5, 0x7E, 0x91];
const F_TOY = (r, k) => (((r ^ k) & 0x3F) * 7) & 0xFF;      // volutamente NON invertibile (perde 2 bit)
const h2 = (n) => n.toString(16).toUpperCase().padStart(2, '0');
function feistelRound(L, R, k) { return { L: R, R: L ^ F_TOY(R, k), f: F_TOY(R, k) }; }
function FeistelGiocattolo() {
  const [L0, setL0] = useState('4C');
  const [R0, setR0] = useState('A7');
  const [n, setN] = useState(4);
  const l0 = parseInt(L0 || '0', 16) & 255 || 0, r0 = parseInt(R0 || '0', 16) & 255 || 0;
  const enc = []; let L = l0, R = r0;
  K_TOY.forEach((k, i) => { const x = feistelRound(L, R, k); enc.push({ n: i + 1, k, Lin: L, Rin: R, ...x }); L = x.L; R = x.R; });
  const uscita = { L: R, R: L };                                      // scambio finale
  const dec = []; L = uscita.L; R = uscita.R;
  [...K_TOY].reverse().forEach((k, i) => { const x = feistelRound(L, R, k); dec.push({ n: i + 1, k, kn: 4 - i, Lin: L, Rin: R, ...x }); L = x.L; R = x.R; });
  const finale = { L: R, R: L };
  const ok = finale.L === l0 && finale.R === r0;
  const sanit = (s) => s.replace(/[^0-9a-fA-F]/g, '').slice(0, 2).toUpperCase();
  return (
    <div className="sim">
      <div className="sim-title">Simulatore · Feistel a 4 round (metà da 8 bit)</div>
      <div className="row">
        <Field label="L0 (hex)" htmlFor="l0"><input id="l0" className="input mono" style={{ width: '4.5em' }} value={L0} onChange={e => setL0(sanit(e.target.value))} /></Field>
        <Field label="R0 (hex)" htmlFor="r0"><input id="r0" className="input mono" style={{ width: '4.5em' }} value={R0} onChange={e => setR0(sanit(e.target.value))} /></Field>
        <Field label={'Round mostrati: ' + n} className="grow"><input type="range" min="0" max="4" value={n} onChange={e => setN(+e.target.value)} aria-label="Round mostrati" /></Field>
      </div>
      <Grid cols={2}>
        <div>
          <div className="xs muted">CIFRATURA · sottochiavi K1…K4 in ordine</div>
          <Table mono center head={['r', 'chiave', 'L', 'R', 'F(R,K)']} rows={enc.slice(0, n).map(e => [e.n, 'K' + e.n + '=' + h2(e.k), h2(e.L), h2(e.R), h2(e.f)])} />
          {n === 4 ? <p className="small">Dopo l'ultimo round si scambiano le metà: cifrato = <span className="mono hl">{h2(uscita.L)} {h2(uscita.R)}</span></p> : null}
        </div>
        <div>
          <div className="xs muted">DECIFRATURA · stessa struttura, sottochiavi K4…K1</div>
          <Table mono center head={['r', 'chiave', 'L', 'R', 'F(R,K)']} rows={dec.slice(0, n).map(e => [e.n, 'K' + e.kn + '=' + h2(e.k), h2(e.L), h2(e.R), h2(e.f)])} />
          {n === 4 ? <p className="small">Scambio finale: <span className="mono hl">{h2(finale.L)} {h2(finale.R)}</span></p> : null}
        </div>
      </Grid>
      <div className={'feedback ' + (ok ? 'ok' : 'ko')} role="status">
        {n === 4 ? (ok ? 'Il blocco decifrato è uguale all\'originale ' + h2(l0) + ' ' + h2(r0) + ', anche se F perde informazione.' : 'Qualcosa non torna.') : 'Alza il cursore fino a 4 per vedere il ritorno.'}
      </div>
      <p className="xs muted">F(R, K) = ((R ⊕ K) AND 3F) × 7 (mod 256): scarta 2 bit, quindi non è invertibile.</p>
    </div>
  );
}

/* ---------- lettura di una S-box S-DES ---------- */
function LeggiSdesSbox() {
  const [b, setB] = useState('0110');
  const [quale, setQuale] = useState(0);
  const S = quale === 0 ? SDT.S0 : SDT.S1;
  const riga = parseInt(b[0] + b[3], 2), col = parseInt(b[1] + b[2], 2);
  return (
    <div className="sim">
      <div className="sim-title">Simulatore · leggere una S-box</div>
      <div className="row">
        <Btn variant={quale === 0 ? 'primary' : ''} aria-pressed={quale === 0} onClick={() => setQuale(0)}>S0</Btn>
        <Btn variant={quale === 1 ? 'primary' : ''} aria-pressed={quale === 1} onClick={() => setQuale(1)}>S1</Btn>
      </div>
      <BitRow bits={b} group={0} label="4 bit in ingresso (clicca): 1° e 4° scelgono la riga, 2° e 3° la colonna" marks={{ 0: 'warn', 3: 'warn', 1: 'info', 2: 'info' }} onToggle={i => setB(flip(b, i))} />
      <p className="small">Riga: <span className="mono hl">{b[0]}{b[3]} = {riga}</span> · colonna: <span className="mono hl">{b[1]}{b[2]} = {col}</span> · valore: <span className="mono hl">{S[riga][col]}</span> = in 2 bit <span className="mono hl">{S[riga][col].toString(2).padStart(2, '0')}</span></p>
      <V.SboxMatrice righe={S} riga={riga} colonna={col} nome={quale === 0 ? 'S0' : 'S1'} />
    </div>
  );
}

/* ---------- lettura di una S-box DES ---------- */
function LeggiDesSbox() {
  const [b, setB] = useState('011011');
  const [i, setI] = useState(0);
  const riga = parseInt(b[0] + b[5], 2), col = parseInt(b.slice(1, 5), 2);
  const val = DT.S[i][riga * 16 + col];
  return (
    <div className="sim">
      <div className="sim-title">Simulatore · S-box del DES (6 bit → 4 bit)</div>
      <div className="row">
        <Field label={'S-box numero ' + (i + 1)} className="grow"><input type="range" min="0" max="7" value={i} onChange={e => setI(+e.target.value)} aria-label="Numero S-box" /></Field>
      </div>
      <BitRow bits={b} group={0} label="6 bit in ingresso (clicca)" marks={{ 0: 'warn', 5: 'warn', 1: 'info', 2: 'info', 3: 'info', 4: 'info' }} onToggle={j => setB(flip(b, j))} />
      <p className="small">Riga: bit esterni <span className="mono hl">{b[0]}{b[5]} = {riga}</span> · colonna: bit interni <span className="mono hl">{b.slice(1, 5)} = {col}</span> → valore <span className="mono hl">{val}</span> = <span className="mono hl">{val.toString(2).padStart(4, '0')}</span></p>
      <V.SboxMatrice righe={V.desRighe(i)} riga={riga} colonna={col} nome={'S' + (i + 1)} compattaCol />
    </div>
  );
}

/* ---------- effetto valanga sul DES ---------- */
function ValangaDes() {
  const [pos, setPos] = useState(0);
  const mod = flip(C.hexABit(TV_PT), pos);
  const t2 = C.des.traccia(C.bitAHex(mod), TV_KEY);
  const diff = TD.round.map((r, i) => pesoUno(C.xor(r.uscita.L + r.uscita.R, t2.round[i].uscita.L + t2.round[i].uscita.R)));
  const fin = pesoUno(C.xor(C.hexABit(TD.output), C.hexABit(t2.output)));
  return (
    <div className="sim">
      <div className="sim-title">Simulatore · un bit cambiato, round per round</div>
      <BitRow bits={mod} group={8} compact label="Messaggio con un bit invertito (clicca un altro bit per spostarlo)" marks={{ [pos]: 'danger' }} onToggle={i => setPos(i)} />
      <p className="small">Messaggio: <span className="mono">{C.bitAHex(mod)}</span> (originale <span className="mono">{TV_PT}</span>) → cifrato <span className="mono hl">{t2.output}</span> contro <span className="mono">{TD.output}</span></p>
      <div className="scrollx"><table className="table mono"><thead><tr><th>Round</th><th>Bit diversi su 64</th><th></th></tr></thead>
        <tbody>{diff.map((d, i) => <tr key={i}><td>{i + 1}</td><td className="hl">{d}</td><td style={{ width: '60%' }}><div className="barra" style={{ width: (100 * d / 64) + '%' }} /></td></tr>)}</tbody></table></div>
      <p className="small">Cifrato finale: <span className="hl">{fin}</span> bit diversi su 64.</p>
    </div>
  );
}

/* ---------- ECB e CBC con immagine ---------- */
function disegnaPinguino(ctx) {
  ctx.fillStyle = '#aaaaaa'; ctx.fillRect(0, 0, 64, 64);
  const el = (x, y, rx, ry, col, rot) => { ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2); ctx.fill(); };
  el(15, 36, 4, 14, '#000000', 0.25); el(49, 36, 4, 14, '#000000', -0.25);
  el(24, 59, 7, 3, '#555555'); el(40, 59, 7, 3, '#555555');
  el(32, 34, 17, 24, '#000000');
  el(32, 41, 10, 16, '#ffffff');
  el(27, 17, 4, 4, '#ffffff'); el(37, 17, 4, 4, '#ffffff'); el(27, 17, 1.6, 1.6, '#000000'); el(37, 17, 1.6, 1.6, '#000000');
  ctx.fillStyle = '#555555'; ctx.beginPath(); ctx.moveTo(28, 22); ctx.lineTo(36, 22); ctx.lineTo(32, 28); ctx.closePath(); ctx.fill();
}
function livelliPinguino() {
  const cv = document.createElement('canvas'); cv.width = 64; cv.height = 64;
  const ctx = cv.getContext('2d'); disegnaPinguino(ctx);
  const d = ctx.getImageData(0, 0, 64, 64).data, lv = [0, 85, 170, 255], out = [];
  for (let i = 0; i < 64 * 64; i++) {
    const y = (d[i * 4] + d[i * 4 + 1] + d[i * 4 + 2]) / 3;
    out.push(lv.reduce((b, x) => (Math.abs(x - y) < Math.abs(b - y) ? x : b), 0));
  }
  return out;
}
function cbcCifraHex(dati, chiave, iv) {
  let prec = iv, out = '';
  for (let p = 0; p < dati.length; p += 16) {
    const x = C.bitAHex(C.xor(C.hexABit(dati.substr(p, 16)), C.hexABit(prec)));
    prec = C.des.cifra(x, chiave); out += prec;
  }
  return out;
}
const IV_DEMO = 'A1B2C3D4E5F60718';
const cacheImg = {};
function calcolaImmagini(chiave) {
  if (cacheImg[chiave]) return cacheImg[chiave];
  const lv = livelliPinguino();
  const hex = lv.map(v => h2(v)).join('');
  const ecb = C.ecb(hex, chiave, { padding: false }).output;
  const cbc = cbcCifraHex(hex, chiave, IV_DEMO);
  const ris = { orig: lv, ecb: ecb.match(/../g).map(x => parseInt(x, 16)), cbc: cbc.match(/../g).map(x => parseInt(x, 16)) };
  cacheImg[chiave] = ris; return ris;
}
function Tela({ valori, titolo }) {
  const ref = useRef(null);
  useEffect(() => {
    const cv = ref.current; if (!cv) return;
    const ctx = cv.getContext('2d'), id = ctx.createImageData(64, 64);
    valori.forEach((v, i) => { id.data[i * 4] = v; id.data[i * 4 + 1] = v; id.data[i * 4 + 2] = v; id.data[i * 4 + 3] = 255; });
    ctx.putImageData(id, 0, 0);
  }, [valori]);
  return <div className="img-box"><canvas ref={ref} width="64" height="64" role="img" aria-label={titolo} /><div className="small muted">{titolo}</div></div>;
}
function Pinguino({ conCbc }) {
  const [chiave, setChiave] = useState(TV_KEY);
  const [img, setImg] = useState(null);
  const valida = /^[0-9a-fA-F]{16}$/.test(chiave);
  useEffect(() => { if (valida) { const t = setTimeout(() => setImg(calcolaImmagini(chiave.toUpperCase())), 30); return () => clearTimeout(t); } }, [chiave]);
  return (
    <div className="sim">
      <div className="sim-title">Simulatore · cifrare un'immagine con il DES</div>
      <Field label="Chiave DES (16 cifre esadecimali)" htmlFor="pk"><input id="pk" className="input mono" value={chiave} onChange={e => setChiave(e.target.value.toUpperCase())} /></Field>
      {!valida ? <div className="feedback ko">La chiave deve avere 16 cifre esadecimali.</div> : null}
      {img ? (
        <Grid cols={conCbc ? 3 : 2} gap=".6rem">
          <Tela valori={img.orig} titolo="Originale (4096 pixel, 1 byte ciascuno)" />
          <Tela valori={img.ecb} titolo="Cifrata con ECB" />
          {conCbc ? <Tela valori={img.cbc} titolo={'Cifrata con CBC (IV ' + IV_DEMO + ')'} /> : null}
        </Grid>
      ) : <p className="small muted">Calcolo in corso…</p>}
      <p className="xs muted">L'immagine è 64×64 pixel con 4 livelli di grigio, un byte per pixel: 512 blocchi da 8 byte (8 pixel in riga).</p>
    </div>
  );
}

/* ---------- debolezza dei 56 bit ---------- */
const SPAZIO = 72057594037927936;   // 2^56 (esattamente rappresentabile)
function durata(s) {
  if (s < 60) return s.toFixed(0) + ' secondi';
  if (s < 3600) return (s / 60).toFixed(0) + ' minuti';
  if (s < 86400) return (s / 3600).toFixed(0) + ' ore';
  if (s < 86400 * 365) return (s / 86400).toFixed(1).replace('.', ',') + ' giorni';
  return (s / (86400 * 365)).toLocaleString('it-IT', { maximumFractionDigits: 0 }) + ' anni';
}
const sepMigliaia = (n) => n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const RITMI = [['1 milione di chiavi/s', 1e6], ['1 miliardo di chiavi/s', 1e9], ['90 miliardi di chiavi/s (Deep Crack, dato EFF)', 90e9]];

/* ---------- codice PHP ---------- */
const CODICE_3DES = `<?php

$iv     = random_bytes(8);           // blocco DES = 8 byte, quindi IV di 8 byte

$chiaro = openssl_decrypt(substr($dati, 8), 'des-ede3-cbc', $chiave, OPENSSL_RAW_DATA, $iv2);

const CODICE_DES = `<?php

$k = hex2bin('133457799BBCDFF1');

/* ---------- le slide ---------- */
const kk2 = C.des.tripleCifra(TV_PT, TV_KEY, TV_KEY, TV_KEY);
const K2_3 = '0E329232EA6D0D73', K3_3 = '8787878787878787';
const c3 = C.des.tripleCifra(TV_PT, TV_KEY, K2_3, K3_3);
const sk = TD.sottochiavi;

const slides = [

      <div className="stack-lg">

          <Card tone="info"><h3>Come tornare indietro</h3><p className="mono small">R₀ = L₁</p><p className="mono small">L₀ = R₁ ⊕ F(L₁, K₁)</p></Card>
        </Grid>
        <Glow><p className="center">Perché <span className="mono hl">R₁ ⊕ F(R₀, K₁) = L₀ ⊕ F ⊕ F = L₀</span> (A ⊕ K ⊕ K = A).</p></Glow>

    ),
    note: 'In CBC ogni blocco in chiaro viene combinato con XOR con il cifrato precedente prima di essere cifrato: blocchi uguali producono cifrati diversi e l\'immagine diventa rumore. La modalità CBC è calcolata nella pagina con il motore DES (nella libreria è implementata solo ECB, il concatenamento è fatto qui). L\'IV serve per il primo blocco: stesso testo e stessa chiave con IV diverso danno cifrati diversi.' },

  { sezione: 'Debolezze', titolo: 'Il problema dei 56 bit',
    contenuto: () => (
      <div className="stack">
        <p>Le chiavi possibili sono <span className="mono hl">2<sup>56</sup> = {sepMigliaia('72057594037927936')}</span>, circa 7,2 × 10<sup>16</sup>.</p>
        <Table head={['Velocità di ricerca', 'Tempo per provarle tutte']} rows={RITMI.map(([n, r]) => [n, durata(SPAZIO / r)])} />
        <Box type="warn" title="Ordini di grandezza">In media si trova la chiave dopo aver provato metà dello spazio: la metà dei tempi indicati. Con hardware specializzato e molti chip in parallelo la ricerca diventa realistica.</Box>
      </div>
    ),
    note: 'I tempi sono calcolati dividendo 2^56 per la velocità: sono ordini di grandezza, non misure. Circa 90 miliardi di chiavi al secondo è la velocità dichiarata dall\'EFF per Deep Crack (la slide successiva). Confrontare con Cesare: 25 chiavi.' },

  { sezione: 'Debolezze', titolo: 'Deep Crack, 1998',
    contenuto: () => (
      <div className="stack-lg">
        <Table head={['Quando', 'Chi', 'Risultato']} rows={[
          ['1997', 'Progetto DESCHALL (distribuito)', 'Prima «DES Challenge» di RSA risolta in 96 giorni.'],
          ['Gen-feb 1998', 'distributed.net', 'DES Challenge II-1 risolta in 39 giorni.'],
          ['Luglio 1998', 'EFF, macchina «Deep Crack»', 'DES Challenge II-2 risolta in 56 ore. Costo di costruzione sotto i 250.000 dollari.'],
          ['Gen 1999', 'EFF e distributed.net', 'DES Challenge III risolta in circa 22 ore.'],
        ]} />
        <Box type="danger" title="Conclusione">Il DES con una sola chiave a 56 bit non è più sicuro: dimostrazione pubblica che un attacco a forza bruta era alla portata di organizzazioni con pochi mezzi.</Box>
      </div>
    ),
    note: 'Fonti: Electronic Frontier Foundation (libro «Cracking DES», 1998), RSA Laboratories DES Challenges. Dettagli: Deep Crack aveva 1.856 chip dedicati; la data esatta di fine ricerca è il 15 luglio 1998 (annuncio del 17). I numeri sono quelli diffusi dall\'EFF; in caso di dubbio, citare le fonti prima di ripeterli. Insistere sul messaggio: non cambia l\'algoritmo ma la potenza di calcolo disponibile.' },

  { sezione: 'Successori', titolo: 'Triple DES (3DES)',
    contenuto: () => (
      <div className="stack-lg">
        <Flow steps={[
          { label: 'Blocco', sub: '64 bit' },
          { label: 'Cifra con K1', sub: 'E', color: 'var(--info)' },
          { label: 'Decifra con K2', sub: 'D', color: 'var(--accent)' },
          { label: 'Cifra con K3', sub: 'E', color: 'var(--info)' },
          { label: 'Cifrato', sub: '64 bit', color: 'var(--success)' },
        ]} />
        <Grid cols={2} stretch>
          <Card tone="accent"><h3>EDE: perché «decifra» al centro</h3><p className="small">Con K1 = K2 = K3 le tre operazioni si semplificano e si ottiene il DES singolo: compatibilità con i sistemi vecchi. Qui: <span className="mono hl">{kk2}</span> = DES singolo di {TV_PT}.</p></Card>
          <Card tone="danger"><h3>Sicurezza</h3><p className="small">Chiave di 168 bit (3 × 56), ma l'attacco «meet-in-the-middle» riduce la sicurezza effettiva a circa <span className="hl">112 bit</span>. Resta lento e con blocchi di 64 bit: oggi è sconsigliato.</p></Card>
        </Grid>
        <p className="small muted">Con tre chiavi diverse ({TV_KEY}, {K2_3}, {K3_3}) lo stesso blocco diventa <span className="mono hl">{c3}</span>.</p>
      </div>
    ),
    note: 'Perché non cifrare due volte? Il «meet-in-the-middle» rende il doppio DES poco più forte del singolo (circa 57 bit). Perciò si passa a tre operazioni. Triple DES è rimasto in uso per anni nei circuiti bancari; NIST lo ha dichiarato deprecato nel 2019 (SP 800-131A rev. 2) e dal 2024 non ne ammette più l\'uso per cifrare: resta consentito solo per decifrare dati già cifrati. I valori mostrati sono calcolati da crypto.js e controllati con OpenSSL.' },

  { sezione: 'Successori', titolo: 'AES: il successore',
    contenuto: () => (
      <div className="stack-lg">
        <Grid cols={3} stretch>
          <Card tone="accent"><h3>Concorso</h3><p className="small">NIST lancia una gara pubblica nel 1997. Vince <b>Rijndael</b> (Daemen e Rijmen, Belgio). AES diventa standard nel <span className="hl">2001</span> (FIPS 197).</p></Card>
          <Card tone="info"><h3>Parametri</h3><p className="small">Blocco da <span className="hl">128 bit</span>, chiave da 128, 192 o 256 bit; 10, 12 o 14 round.</p></Card>
          <Card tone="success"><h3>Struttura</h3><p className="small">Non è Feistel ma una <span className="hl">rete di sostituzione-permutazione</span>: tutto il blocco viene trasformato a ogni round.</p></Card>
        </Grid>
        <Box type="success" title="Oggi">AES-128 e AES-256 sono lo standard di fatto (Wi-Fi WPA2, HTTPS, dischi cifrati). Le idee viste nel DES (confusione, diffusione, round, sottochiavi) si ritrovano tutte.</Box>
      </div>
    ),
    note: 'Cenno, senza entrare nel dettaglio. Il concorso AES è stato pubblico, come per DES: i candidati sono stati analizzati da tutta la comunità. Per gli studenti: il vantaggio del blocco da 128 bit e della chiave da 128 bit è enorme; anche con 10^12 chiavi al secondo servirebbero tempi astronomici.' },

  { sezione: 'Codice PHP', titolo: 'Cifrare con openssl_encrypt()',
    contenuto: () => (
      <Code title="3des-cbc.php" code={CODICE_3DES} reveal explain={SPIEGA_3DES} />
    ),
    note: 'In PHP non si riscrive il DES: si usa la libreria OpenSSL con openssl_encrypt() e openssl_decrypt(). Insistete su tre scelte: algoritmo moderno quando possibile (AES), IV casuale a ogni messaggio, IV trasmesso in chiaro insieme al cifrato. In laboratorio (lab-php/07-des-openssl) si fa lo stesso con 3DES e AES-128-CBC e si confronta ECB con CBC su blocchi ripetuti.' },

  { sezione: 'Codice PHP', titolo: 'E il DES singolo?',
    contenuto: () => (
      <div className="stack">
        <Code title="des-singolo.php" code={CODICE_DES} highlight={[5, 6, 9]} />
        <Box type="warn" title="Comportamento reale con PHP 8.3 e OpenSSL 3">
          <span className="mono">openssl_encrypt(…, 'DES-ECB', …)</span> restituisce <span className="mono hl">false</span> (errore «unsupported»): in OpenSSL 3 il DES singolo sta nel provider legacy, spesso non attivo. 3DES e AES funzionano. Con K1 = K2 = K3 il 3DES dà lo stesso risultato del vettore ufficiale <span className="mono hl">85E813540F0AB405</span>.
        </Box>
      </div>
    ),
    note: 'Comportamento verificato in locale con PHP 8.3 e OpenSSL 3.0: openssl_get_cipher_methods() non contiene più DES-ECB / des-cbc; contiene des-ede e des-ede3. Il trucco di usare des-ede-ecb con la chiave ripetuta (K||K) riproduce il DES singolo e la prova è il vettore ufficiale. Su altre installazioni (provider legacy attivo, PHP/OpenSSL diversi) il risultato può essere diverso: provare con openssl_get_cipher_methods().' },

  { sezione: 'Riepilogo', titolo: 'Riepilogo e prossimi passi',
    contenuto: () => (
      <div className="stack-lg">
        <ul>
          <li>Feistel: <span className="mono">L′ = R, R′ = L ⊕ F(R, K)</span>; per decifrare stessa struttura, sottochiavi invertite.</li>
          <li>DES: blocco 64 bit, chiave 56 bit, 16 round; F = E, XOR, 8 S-box, P.</li>
          <li>ECB lascia vedere la struttura dei dati; CBC la nasconde con IV e concatenamento.</li>
          <li>56 bit si forzano (Deep Crack, 1998): 3DES e poi AES.</li>
        </ul>
        <Grid cols={3} stretch>
          <Card tone="accent"><h3>Laboratorio</h3><p className="small">openssl_encrypt, ECB contro CBC, S-DES in PHP.</p><ActivityBadge href="../lab-php/07-des-openssl/scheda.html" label="Scheda del lab" icon="🧪" /></Card>
          <Card tone="info"><h3>Simulazioni</h3><p className="small">S-DES e DES con input libero.</p><ActivityBadge href="simulazione-des.html" label="Simulatore DES" icon="🔐" /></Card>
          <Card tone="success"><h3>Avanti</h3><p className="small">Chiavi pubbliche: matematica per RSA.</p><ActivityBadge href="../modulo-7-matematica-rsa/slide.html" stesso label="Modulo 7" icon="➡️" /></Card>
        </Grid>
      </div>
    ),
    note: 'Chiusura: quattro idee da portarsi via. Il problema che resta aperto, anche con AES, è lo scambio della chiave: chiave segreta condivisa tra chi cifra e chi decifra. Il modulo 7 introduce la matematica che permette di risolverlo con RSA.' },
];

Deck.mount(slides, { modulo: 6, nome: 'DES', indice: '../index.html' });
</script>
