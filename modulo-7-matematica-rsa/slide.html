<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modulo 7 — La matematica di RSA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.4/babel.min.js"></script>
<script src="../assets/crypto.js"></script>
<script src="../assets/deck.js"></script>
<script src="mat-ui.js"></script>
<style>
  .mult { display: grid; gap: 2px; font-family: var(--f-mono); font-size: var(--fs-xs); }
  .mult .c { text-align: center; padding: .12em 0; border-radius: 4px; background: var(--bg); border: 1px solid var(--border); color: var(--text-dim); min-width: 0; }
  .mult .c.h { background: var(--bg-light); color: var(--accent-alt); font-weight: 700; }
  .mult .c.uno { background: color-mix(in srgb, var(--success) 26%, var(--bg)); border-color: var(--success); color: var(--text); font-weight: 700; }
  .mult .c.nr { background: color-mix(in srgb, var(--danger) 16%, var(--bg)); }
  .due { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
  .tre { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: .6rem; }
  .big-n { font-family: var(--f-title); font-weight: 700; color: var(--accent-alt); }
  .lista-x { display: flex; flex-wrap: wrap; gap: .25rem .5rem; font-family: var(--f-mono); font-size: var(--fs-xs); }
  .lista-x span { padding: .05em .45em; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); }
  .lista-x span.si { border-color: var(--success); background: color-mix(in srgb, var(--success) 22%, var(--bg)); color: var(--text); font-weight: 700; }
  .bot { display: grid; grid-template-columns: 1fr auto 1fr; gap: .8rem; align-items: stretch; }
  .bot .freccia { align-self: center; font-size: 1.6rem; color: var(--text-muted); text-align: center; }
  @media (max-width: 900px) { .due, .tre { grid-template-columns: 1fr; } .bot { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo } = React;
const { Box, Glow, Chip, Grid, Card, Btn, Field, Table, Flow, ActivityBadge, Steps, Code, BitRow } = UI;
const { num, modB, fmt, CampoNum, Orologio, TabEuclide, TabEsteso, TabInverso, TabPotenza, conteggioMoltiplicazioni, cifre } = MatUI;
const C = window.Cripto;

/* ---------- calcolatori inline ---------- */

function SimOrologio() {
  const [n, setN] = useState(12);
  const [a, setA] = useState('29');
  const A = num(a);
  const r = A === null ? null : Number(modB(A, BigInt(n)));
  return (
    <div className="sim">
      <div className="sim-title">Orologio con n ore</div>
      <Grid cols={2}>
        <div className="stack">
          <Field label={'Ore sul quadrante: ' + n}><input type="range" min="2" max="24" value={n} onChange={e => setN(+e.target.value)} aria-label="Numero di ore" /></Field>
          <CampoNum label="Numero a (anche negativo)" value={a} onChange={setA} max={9} />
          {r !== null ? (
            <p>La lancetta, dopo <span className="mono hl">{fmt(A)}</span> passi da 0, si ferma su <span className="mono hl">{r}</span>.<br />
              <span className="mono">{fmt(A)} mod {n} = {r}</span></p>
          ) : <p className="muted small">Scrivi un numero intero.</p>}
        </div>
        <div className="center"><Orologio n={n} v={r} size={190} /></div>
      </Grid>
    </div>
  );
}

function CalcMod() {
  const [a, setA] = useState('-17');
  const [n, setN] = useState('5');
  const A = num(a), N = num(n);
  const ok = A !== null && N !== null && N > 1n;
  const r = ok ? modB(A, N) : null;
  const q = ok ? (A - r) / N : null;
  return (
    <div className="sim">
      <div className="sim-title">Calcola a mod n</div>
      <div className="due">
        <CampoNum label="a" value={a} onChange={setA} max={18} />
        <CampoNum label="n (modulo)" value={n} onChange={setN} max={18} />
      </div>
      {ok ? (
        <>
          <p className="mono">{fmt(A)} = {fmt(N)} · ({fmt(q)}) + {fmt(r)}  →  <span className="hl">{fmt(A)} mod {fmt(N)} = {fmt(r)}</span></p>
          <div className="lista-x" aria-label="Numeri congruenti">
            {[-2, -1, 0, 1, 2].map(k => <span key={k} className={k === 0 ? 'si' : ''}>{fmt(r + N * BigInt(k))}</span>)}<span>…</span>
          </div>
          <p className="small muted">I numeri nella lista sono tutti <i>congruenti</i> a {fmt(r)} modulo {fmt(N)}: sullo stesso punto dell'orologio.
            {A < 0n ? <> In PHP <span className="mono">{fmt(A)} % {fmt(N)}</span> darebbe <span className="mono">{fmt(A % N)}</span>: serve la correzione <span className="mono">((a % n) + n) % n</span>.</> : null}</p>
        </>
      ) : <p className="small muted">Servono due interi, con n maggiore di 1.</p>}
    </div>
  );
}

function CalcOperazioni() {
  const [a, setA] = useState('47');
  const [b, setB] = useState('38');
  const [n, setN] = useState('7');
  const A = num(a), B = num(b), N = num(n);
  const ok = A !== null && B !== null && N !== null && N > 1n;
  return (
    <div className="sim">
      <div className="sim-title">Somma e prodotto in modulo</div>
      <div className="tre">
        <CampoNum label="a" value={a} onChange={setA} max={12} />
        <CampoNum label="b" value={b} onChange={setB} max={12} />
        <CampoNum label="n" value={n} onChange={setN} max={12} />
      </div>
      {ok ? (() => {
        const ra = modB(A, N), rb = modB(B, N);
        return (
          <Table mono head={['', 'Metodo lungo', 'Metodo corto (riduci prima)']} rows={[
            ['Somma', fmt(A) + ' + ' + fmt(B) + ' = ' + fmt(A + B) + ' → ' + fmt(modB(A + B, N)), '(' + fmt(ra) + ' + ' + fmt(rb) + ') mod ' + fmt(N) + ' = ' + fmt(modB(ra + rb, N))],
            ['Prodotto', fmt(A) + ' · ' + fmt(B) + ' = ' + fmt(A * B) + ' → ' + fmt(modB(A * B, N)), '(' + fmt(ra) + ' · ' + fmt(rb) + ') mod ' + fmt(N) + ' = ' + fmt(modB(ra * rb, N))],
          ]} />
        );
      })() : <p className="small muted">Servono tre interi, con n maggiore di 1.</p>}
    </div>
  );
}

function TavolaMoltiplicazione() {
  const [n, setN] = useState(7);
  const celle = [];
  const inv = [];
  for (let a = 1; a < n; a++) { inv[a] = null; for (let x = 1; x < n; x++) if ((a * x) % n === 1) inv[a] = x; }
  celle.push(<div key="h" className="c h">×</div>);
  for (let x = 1; x < n; x++) celle.push(<div key={'h' + x} className="c h">{x}</div>);
  for (let a = 1; a < n; a++) {
    celle.push(<div key={'r' + a} className={'c h' + (inv[a] === null ? ' nr' : '')}>{a}</div>);
    for (let x = 1; x < n; x++) {
      const v = (a * x) % n;
      celle.push(<div key={a + '-' + x} className={'c' + (v === 1 ? ' uno' : '') + (inv[a] === null ? ' nr' : '')}>{v}</div>);
    }
  }
  const senza = []; for (let a = 1; a < n; a++) if (inv[a] === null) senza.push(a);
  return (
    <div className="sim">
      <div className="sim-title">Tabella del prodotto modulo n</div>
      <div className="row">
        <Field label={'Modulo n = ' + n} className="grow"><input type="range" min="3" max="13" value={n} onChange={e => setN(+e.target.value)} aria-label="Modulo" /></Field>
        <Chip color={senza.length ? 'warn' : 'success'}>{n} {C.isPrimo(n) ? 'è primo' : 'non è primo'}</Chip>
      </div>
      <div className="mult" style={{ gridTemplateColumns: `repeat(${n}, minmax(0, 1fr))` }} role="img" aria-label={'Tabella del prodotto modulo ' + n}>{celle}</div>
      <p className="small">{senza.length === 0
        ? <>Ogni riga contiene un <b className="t-success">1</b>: ogni numero ha un inverso.</>
        : <>Le righe <b className="t-danger">{senza.join(', ')}</b> non contengono nessun 1: quei numeri non hanno inverso (hanno un fattore in comune con {n}).</>}</p>
    </div>
  );
}

function CalcPrimi() {
  const [n, setN] = useState('3233');
  const [m, setM] = useState('3120');
  const N = num(n), M = num(m);
  const okN = N !== null && N > 0n && N < 1000000000000000n;
  const f = okN && N > 1n ? C.fattorizza(N).fattori : [];
  const okM = N !== null && M !== null && N > 0n && M > 0n;
  const g = okM ? C.mcd(N, M) : null;
  return (
    <div className="sim">
      <div className="sim-title">Primo? Coprimi?</div>
      <div className="due">
        <CampoNum label="Numero n" value={n} onChange={setN} max={15} />
        <CampoNum label="Un altro numero m" value={m} onChange={setM} max={15} />
      </div>
      {okN ? <p>{N < 2n ? <>{fmt(N)} non è né primo né composto.</> : C.isPrimo(N) ? <><span className="mono hl">{fmt(N)}</span> è <b className="t-success">primo</b>.</> :
        <><span className="mono hl">{fmt(N)}</span> è <b className="t-warn">composto</b>: <span className="mono">{fmt(N)} = {f.map(x => fmt(x)).join(' · ')}</span></>}</p> : <p className="small muted">Numero intero positivo (massimo 15 cifre).</p>}
      {okM ? <p><span className="mono">MCD({fmt(N)}, {fmt(M)}) = {fmt(g)}</span> → {g === 1n ? <b className="t-success">coprimi</b> : <b className="t-warn">non coprimi</b>}</p> : null}
    </div>
  );
}

function CalcMcd() {
  const [a, setA] = useState('1071');
  const [b, setB] = useState('462');
  const A = num(a), B = num(b);
  const ok = A !== null && B !== null && A > 0n && B > 0n;
  return (
    <div className="sim">
      <div className="sim-title">Calcolatore MCD</div>
      <div className="due">
        <CampoNum label="Primo numero" value={a} onChange={setA} max={30} />
        <CampoNum label="Secondo numero" value={b} onChange={setB} max={30} />
      </div>
      {ok ? <TabEuclide a={A} b={B} /> : <p className="small muted">Scrivi due interi positivi.</p>}
    </div>
  );
}

function CercaInverso() {
  const [a, setA] = useState('7');
  const [m, setM] = useState('15');
  const A = num(a), M = num(m);
  const ok = A !== null && M !== null && M > 1n && M <= 40n;
  const lista = [];
  let trovati = [];
  if (ok) for (let x = 0n; x < M; x++) { const v = modB(A * x, M); lista.push({ x, v }); if (v === 1n) trovati.push(x); }
  return (
    <div className="sim">
      <div className="sim-title">Cerca l'inverso a tentativi</div>
      <div className="due">
        <CampoNum label="a" value={a} onChange={setA} max={4} />
        <CampoNum label="Modulo m (al massimo 40)" value={m} onChange={setM} max={2} />
      </div>
      {ok ? (<>
        <div className="lista-x" aria-label="Prodotti">
          {lista.map(o => <span key={String(o.x)} className={o.v === 1n ? 'si' : ''}>{String(o.x)}→{String(o.v)}</span>)}
        </div>
        <p className="small">Ogni voce è <span className="mono">x → a·x mod m</span>. {trovati.length ? <>L'inverso di {fmt(A)} modulo {fmt(M)} è <b className="mono hl">{fmt(trovati[0])}</b>.</> : <>Non compare mai 1: <b className="t-danger">nessun inverso</b> (MCD = {fmt(C.mcd(modB(A, M), M))}).</>}</p>
      </>) : <p className="small muted">Servono a intero e modulo tra 2 e 40.</p>}
    </div>
  );
}

function CalcInverso() {
  const [a, setA] = useState('17');
  const [m, setM] = useState('3120');
  const A = num(a), M = num(m);
  const ok = A !== null && M !== null && M > 1n;
  return (
    <div className="sim">
      <div className="sim-title">Inverso con Euclide esteso</div>
      <div className="due">
        <CampoNum label="a" value={a} onChange={setA} max={30} />
        <CampoNum label="Modulo m" value={m} onChange={setM} max={30} />
      </div>
      {ok ? <TabInverso a={A} m={M} /> : <p className="small muted">Il modulo deve essere un intero maggiore di 1.</p>}
    </div>
  );
}

function CalcPhi() {
  const [p, setP] = useState('61');
  const [q, setQ] = useState('53');
  const P = num(p), Q = num(q);
  const ok = P !== null && Q !== null && P > 1n && Q > 1n && P < 1000000000000n && Q < 1000000000000n;
  const ps = ok && C.isPrimo(P), qs = ok && C.isPrimo(Q);
  return (
    <div className="sim">
      <div className="sim-title">φ(n) per n = p · q</div>
      <div className="due">
        <CampoNum label="p (primo)" value={p} onChange={setP} max={12} />
        <CampoNum label="q (primo)" value={q} onChange={setQ} max={12} />
      </div>
      {ok && ps && qs && P !== Q ? (
        <p className="mono">n = {fmt(P)} · {fmt(Q)} = <span className="hl">{fmt(P * Q)}</span><br />
          φ(n) = ({fmt(P)} − 1) · ({fmt(Q)} − 1) = {fmt(P - 1n)} · {fmt(Q - 1n)} = <span className="hl">{fmt((P - 1n) * (Q - 1n))}</span></p>
      ) : <p className="small t-warn">{!ok ? 'Servono due interi maggiori di 1.' : (!ps || !qs) ? 'Entrambi devono essere primi.' : 'p e q devono essere diversi.'}</p>}
    </div>
  );
}

function ContaCoprimi() {
  const [n, setN] = useState(15);
  const lista = []; for (let k = 1; k <= n; k++) if (C.mcd(k, n) === 1) lista.push(k);
  return (
    <div className="sim">
      <div className="sim-title">φ(n) = quanti numeri da 1 a n sono coprimi con n</div>
      <Field label={'n = ' + n}><input type="range" min="2" max="40" value={n} onChange={e => setN(+e.target.value)} aria-label="n" /></Field>
      <div className="lista-x">{Array.from({ length: n }, (_, i) => i + 1).map(k => <span key={k} className={C.mcd(k, n) === 1 ? 'si' : ''}>{k}</span>)}</div>
      <p className="small">I coprimi con {n} sono {lista.length}: <span className="mono hl">φ({n}) = {lista.length}</span>. {C.isPrimo(n) ? <>{n} è primo: φ = {n} − 1.</> : null}</p>
    </div>
  );
}

function CalcEulero() {
  const [a, setA] = useState('2');
  const [n, setN] = useState('15');
  const A = num(a), N = num(n);
  const ok = A !== null && N !== null && N > 1n && N < 1000000n && A > 0n;
  let phi = 0n; if (ok) for (let k = 1n; k <= N; k++) if (C.mcd(k, N) === 1n) phi++;
  const g = ok ? C.mcd(A, N) : null;
  return (
    <div className="sim">
      <div className="sim-title">Verifica: a^φ(n) mod n</div>
      <div className="due">
        <CampoNum label="a" value={a} onChange={setA} max={8} />
        <CampoNum label="n" value={n} onChange={setN} max={6} />
      </div>
      {ok ? (g === 1n
        ? <p className="mono">φ({fmt(N)}) = {fmt(phi)}<br />{fmt(A)}^{fmt(phi)} mod {fmt(N)} = <span className="hl">{fmt(C.potenzaModulare(A, phi, N))}</span></p>
        : <p className="small t-warn">MCD({fmt(A)}, {fmt(N)}) = {fmt(g)}: la proprietà vale solo per numeri coprimi con n.</p>)
        : <p className="small muted">Servono a ≥ 1 e n tra 2 e 999 999.</p>}
    </div>
  );
}

function CalcPotenza() {
  const [b, setB] = useState('65');
  const [e, setE] = useState('17');
  const [m, setM] = useState('3233');
  const B = num(b), E = num(e), M = num(m);
  const ok = B !== null && E !== null && M !== null && B >= 0n && E >= 0n && E < 1000000000000n && M > 1n;
  const cont = ok ? conteggioMoltiplicazioni(E) : null;
  return (
    <div className="sim">
      <div className="sim-title">Calcolatore · base ^ esponente mod modulo</div>
      <div className="tre">
        <CampoNum label="Base" value={b} onChange={setB} max={18} />
        <CampoNum label="Esponente" value={e} onChange={setE} max={12} />
        <CampoNum label="Modulo" value={m} onChange={setM} max={18} />
      </div>
      {ok ? <>
        <TabPotenza base={B} esp={E} mod={M} />
        <p className="small muted">Moltiplicazioni modulari: <span className="mono hl">{cont.totale}</span> (ingenuo: {fmt(E > 0n ? E - 1n : 0n)}).</p>
      </> : <p className="small muted">Base ≥ 0, esponente fino a 999 999 999 999, modulo maggiore di 1.</p>}
    </div>
  );
}

function prossimoPrimo(x) { let n = BigInt(x); while (!C.isPrimo(n)) n++; return n; }
const COPPIE = [
  { etichetta: '2 cifre', p: 61n, q: 53n },
  { etichetta: '4 cifre', p: prossimoPrimo(9000), q: prossimoPrimo(9500) },
  { etichetta: '6 cifre', p: prossimoPrimo(900000), q: prossimoPrimo(950000) },
  { etichetta: '7 cifre', p: prossimoPrimo(9000000), q: prossimoPrimo(9500000) },
  { etichetta: '10 cifre', p: prossimoPrimo(9000000000n), q: prossimoPrimo(9500000000n) },
];
function FacileDifficile() {
  const [i, setI] = useState(2);
  const [ris, setRis] = useState(null);
  const { p, q } = COPPIE[i], n = p * q;
  const percorribile = n < 100000000000000n;
  const prova = () => { const t0 = performance.now(); const r = C.fattorizza(n); setRis({ ...r, ms: performance.now() - t0 }); };
  const stimaPassi = (() => { let s = 1n; while (s * s <= n) s *= 2n; return s / 2n; })();   // ordine di grandezza di sqrt(n)
  return (
    <div className="sim">
      <div className="sim-title">Moltiplicare è facile, fattorizzare no</div>
      <div className="row" role="group" aria-label="Dimensione dei primi">
        {COPPIE.map((c, k) => <Btn key={k} small variant={k === i ? 'primary' : ''} aria-pressed={k === i} onClick={() => { setI(k); setRis(null); }}>{c.etichetta}</Btn>)}
      </div>
      <p className="mono">p · q = {fmt(p)} · {fmt(q)} = <span className="hl">{fmt(n)}</span> <span className="muted">(istantaneo: una moltiplicazione)</span></p>
      <div className="row">
        <Btn variant="primary" small onClick={prova} disabled={!percorribile}>Fattorizza {fmt(n)}</Btn>
        {!percorribile ? <span className="small t-warn">Troppo grande per provarla qui: servirebbero circa 2^{stimaPassi.toString(2).length - 1}/2 divisioni.</span> : null}
      </div>
      {ris ? <p className="mono">Fattori: {ris.fattori.map(x => fmt(x)).join(' · ')}<br />Divisioni tentate: <span className="hl">{fmt(ris.tentativi)}</span> in {ris.ms.toFixed(1)} ms</p> : null}
    </div>
  );
}

/* ---------- dati calcolati con crypto.js ---------- */

const POT = C.potenzaModularePassi(65, 17, 3233);
const POT17 = (() => { let r = 1n; for (let i = 0; i < 17; i++) r = r * 65n; return r; })();   // 65^17 esatta, senza operatore **
const CIFRE_NAIVE = POT.risultato && POT17.toString().length;
const BIT_RSA = 2048, E_RSA = 65537;
const CIFRE_RSA_ESP = Math.floor(BIT_RSA * E_RSA * Math.log10(2)) + 1;

const stepEuclide = [
  { title: 'Divisione 1', content: <p className="mono">3120 = 17 · <b className="hl">183</b> + <b className="hl">9</b> <span className="muted"> (17·183 = 3111)</span></p> },
  { title: 'Divisione 2: si scala', content: <p className="mono">17 = 9 · <b className="hl">1</b> + <b className="hl">8</b> <span className="muted"> (ora si divide 17 per 9)</span></p> },
  { title: 'Divisione 3', content: <p className="mono">9 = 8 · <b className="hl">1</b> + <b className="hl">1</b></p> },
  { title: 'Divisione 4: resto zero', content: <p className="mono">8 = 1 · <b className="hl">8</b> + <b className="hl">0</b> → ultimo resto non nullo: <b className="hl">1</b></p> },
  { title: 'Conclusione', content: <p><span className="mono hl">MCD(3120, 17) = 1</span>: i due numeri sono <b className="t-success">coprimi</b>. Per RSA è la condizione che permette di scegliere e = 17.</p> },
];

const CODICE_POT = `<?php
function potenzaModulare(int $base, int $esp, int $mod): int {
    $risultato = 1;
    $base = $base % $mod;
    while ($esp > 0) {
        if ($esp & 1) {                       // bit meno significativo = 1?
            $risultato = ($risultato * $base) % $mod;
        }
        $base = ($base * $base) % $mod;       // quadrato
        $esp = $esp >> 1;                     // scarta il bit appena usato
    }
    return $risultato;
}

echo potenzaModulare(65, 17, 3233);`;
const SPIEGA_POT = [
  '', 'Base, esponente e modulo sono interi: va bene finché i numeri restano piccoli.',
  'Il risultato parte da 1 (elemento neutro del prodotto).', 'Si riduce subito la base: i numeri restano piccoli.',
  'Finché ci sono bit nell\'esponente, si va avanti: un giro per ogni bit.', 'Con & 1 si legge il bit meno significativo.',
  'Bit a 1: si moltiplica il risultato per la base, sempre riducendo con %.', 'Fine del ramo.',
